name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: platform (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: packages/platform/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # The build never connects to a database; this placeholder only keeps
      # the route modules from failing their start-up check.
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DATABASE_SCHEMA: ff

  python:
    name: python (syntax + payload validity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile every Python module
        run: |
          python -m compileall -q packages/
          echo "compileall OK"

      - name: Parse every JSON payload
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path("packages").rglob("*.json"):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append("%s: %s" % (p, e))
          print("\n".join(bad) if bad else "all json OK")
          sys.exit(1 if bad else 0)
          PY

  javascript:
    name: javascript (syntax check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --check every script
        run: |
          set -e
          find packages -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) \
            -not -path '*/node_modules/*' -print0 \
            | xargs -0 -n1 node --check
          echo "node --check OK"
