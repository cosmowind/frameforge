<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>HMD 双目预览 — video-sort-package</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.5 system-ui, "Microsoft YaHei", sans-serif;
    margin: 0; background: #0e1116; color: #e6e6e6;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 12px 20px; background: #161b22; border-bottom: 1px solid #2a3138;
    display: flex; align-items: center; gap: 16px;
  }
  h1 { margin: 0; font-size: 16px; font-weight: 500; }
  .meta { font-size: 11px; color: #6e7681; }
  .meta b { color: #c9d1d9; font-family: ui-monospace, monospace; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 10px; }
  .pane { flex: 1; max-width: 50%; position: relative; background: #000;
    border-radius: 4px; overflow: hidden; min-height: 360px; }
  .pane video, .pane canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  .pane video[hidden] { display: none; }
  .pane-label { position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.75); color: #fff; padding: 3px 8px;
    border-radius: 3px; font-size: 11px; font-family: ui-monospace, monospace;
    z-index: 1; }
  .pane-stats { position: absolute; bottom: 8px; right: 8px;
    background: rgba(0,0,0,0.75); color: #6e7681; padding: 2px 6px;
    border-radius: 3px; font-size: 10px; font-family: ui-monospace, monospace; }
  .controls { padding: 10px 20px; background: #161b22; border-top: 1px solid #2a3138;
    display: flex; gap: 8px; align-items: center; }
  button { background: #21262d; color: #e6e6e6; border: 1px solid #2a3138;
    padding: 6px 14px; border-radius: 4px; font-size: 13px; cursor: pointer; }
  button:hover { background: #2a3138; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  input[type=range] { flex: 1; }
  .hud { font-size: 11px; color: #9aa4ad; font-family: ui-monospace, monospace;
    min-width: 220px; text-align: right; }
  .err { background: #3a1f1f; border: 1px solid #f85149; padding: 8px 14px;
    border-radius: 6px; color: #ffa198; font-size: 13px; margin: 10px 20px; }
  .err.hidden { display: none; }

  /* progress overlay */
  .progress-overlay {
    position: fixed; inset: 0; background: rgba(14,17,22,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000; backdrop-filter: blur(2px);
  }
  .progress-overlay.hidden { display: none; }
  .progress-box {
    background: #161b22; border: 1px solid #2a3138; border-radius: 8px;
    padding: 32px 40px; min-width: 420px; max-width: 600px;
  }
  .progress-spinner {
    width: 48px; height: 48px; margin: 0 auto 16px;
    border: 4px solid #2a3138; border-top-color: #1f6feb;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-title {
    font-size: 16px; font-weight: 500; margin-bottom: 12px; text-align: center;
  }
  .progress-stage {
    color: #1f6feb; font-size: 13px; text-align: center; margin-bottom: 16px;
    font-family: ui-monospace, monospace;
  }
  .progress-bar-bg {
    height: 8px; background: #0d1117; border-radius: 4px; overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-bar-fg {
    height: 100%; background: linear-gradient(90deg, #1f6feb, #58a6ff);
    width: 0%; transition: width 0.2s ease;
  }
  .progress-pct {
    text-align: center; font-size: 12px; color: #9aa4ad;
    font-family: ui-monospace, monospace;
  }
  .progress-stages {
    display: flex; justify-content: space-between; margin-top: 14px;
    font-size: 11px; color: #6e7681;
  }
  .progress-stages .stage { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
  .progress-stages .stage .dot { width: 8px; height: 8px; border-radius: 50%; background: #2a3138; }
  .progress-stages .stage.active .dot { background: #1f6feb; }
  .progress-stages .stage.done .dot { background: #3fb950; }
  .progress-stages .stage.active, .progress-stages .stage.done { color: #c9d1d9; }
  .pick { padding: 10px 20px; background: #161b22; border-bottom: 1px solid #2a3138;
    display: flex; gap: 8px; align-items: center; }
  .pick input { flex: 1; padding: 6px 10px; background: #0d1117; color: #e6e6e6;
    border: 1px solid #2a3138; border-radius: 4px; font-family: ui-monospace, monospace; }
  .pick .stat { font-size: 11px; color: #6e7681; }
</style>
</head>
<body>

<header>
  <h1>HMD 双目预览</h1>
  <div class="meta" id="meta">未选择 session</div>
</header>

<div class="pick">
  <input id="folderInput" type="text" placeholder="输入 HMD session 文件夹绝对路径 (例 F:/.../session_00000)" />
  <button id="loadBtn">加载</button>
  <button id="autoBtn" title="尝试从 URL 读取 ?path=">← URL</button>
  <span class="stat" id="pickStat"></span>
</div>

<div class="err hidden" id="errBox"></div>

<div class="progress-overlay hidden" id="progressOverlay">
  <div class="progress-box">
    <div class="progress-spinner" id="progSpinner"></div>
    <div class="progress-title" id="progTitle">加载 HMD 文件中</div>
    <div class="progress-stage" id="progStage">准备…</div>
    <div class="progress-bar-bg"><div class="progress-bar-fg" id="progBar"></div></div>
    <div class="progress-pct" id="progPct">0%</div>
    <div class="progress-stages">
      <div class="stage" id="stg1"><div class="dot"></div><div>下载</div></div>
      <div class="stage" id="stg2"><div class="dot"></div><div>解析</div></div>
      <div class="stage" id="stg3"><div class="dot"></div><div>拆分</div></div>
      <div class="stage" id="stg4"><div class="dot"></div><div>解码</div></div>
    </div>
  </div>
</div>

<div class="stage">
  <div class="pane">
    <video id="leftVideo" hidden></video>
    <canvas id="leftCanvas" width="960" height="540"></canvas>
    <div class="pane-label">左眼 (camera 0)</div>
    <div class="pane-stats" id="leftStat">--</div>
  </div>
  <div class="pane">
    <video id="rightVideo" hidden></video>
    <canvas id="rightCanvas" width="960" height="540"></canvas>
    <div class="pane-label">右眼 (camera 1)</div>
    <div class="pane-stats" id="rightStat">--</div>
  </div>
</div>

<div class="controls">
  <button id="playBtn" disabled>⏯</button>
  <button id="backBtn" disabled>⏮ -5s</button>
  <button id="fwdBtn" disabled>+5s ⏭</button>
  <input id="seek" type="range" min="0" max="1000" value="0" step="1" disabled />
  <span class="hud" id="time">00:00.0 / 00:00.0</span>
  <span class="hud" id="hud">L=0 R=0 Δ=--</span>
</div>

<script type="module" src="/static/js/hmd-preview-ui.js"></script>
</body>
</html>
