# 代码结构速览
structure:
  src/app.py: "Flask 主应用 + 路由注册（544 行）"
  src/run.py: "启动入口 + 磁盘检查 + 自动预热"
  src/config.py: "全局常量与路径配置"
  src/auto_upload.py: "Playwright 自动上传（3895 行，调试中暂未拆）"
  src/device_monitor/: "设备监控包（scanner 319 + copier 613 + monitor 1282）"
  src/routes/: "蓝图路由层（9 个蓝图：data/dim/misc/hmd/upload/video + cleanup + upload_config + auto_upload）"
  src/services/: "业务逻辑层（16 个服务模块）"
  src/models/: "数据层（pg_store/csv_store/cache/dim_registry）"
  src/utils/: "工具函数（path/format/video_frames）"
  src/templates/: "前端页面（index.html 2293 + hmd_preview.html 155）"
  src/static/css/: "样式（index.css 840）"
  src/static/js/: "JS 模块（15 个：render-table/hmd-inline-player/gallery-view/task-validation 等）"
  src/scripts/: "离线运维脚本（30+ 个）"
  src/tools/: "外部工具（hmd_fast/hmd_preprocess/extract_scenario_taxonomy）"
  src/tools/hmd_fast/: "HMD 快速预处理包（path_utils + media_ops + preprocess）"
  scripts/debug/: "Playwright 自动补录调试脚本（9 个，按调试阶段分类）"
  src/vendor-upload-pkg/: "供应商版上传包（备用方案，git ignored node_modules）"
  runtime/: "运行时数据（git ignored）"
  scripts/: "项目级辅助脚本"

# API 端点速览（完整列表见各路由文件）
api_groups:
  视频数据: "/api/data, /api/save, /api/save-rows, /api/delete, /api/scan, /api/data/scan"
  维表管理: "/api/dim/<name>, /api/dim-editable-options, /api/dim/tasks/*, /api/dim/environments/*"
  HMD 处理: "/api/hmd/process, /api/hmd/process-batch, /api/hmd/scan, /api/hmd/info, /api/hmd/raw, /api/hmd/file, /api/hmd/frame, /api/hmd/frames, /api/hmd/mp4, /api/hmd/duration, /api/hmd/register, /api/hmd/retry, /api/hmd/open, /api/hmd/process-status, /api/hmd/queue-status, /api/hmd/is-processing"
  上传: "/api/upload-batch, /api/upload-run, /api/upload-run-cmd, /api/upload-cancel, /api/upload-status, /api/upload-generate, /api/upload-config, /api/upload-options, /api/upload-template-config, /api/upload-template/<row_index>, /api/upload-template-by-path"
  自动上传: "/api/auto-upload-start, /api/auto-upload-status, /api/auto-upload-progress"
  自动补录: "/api/auto-fill, /api/auto-fill/apply, /api/auto-fill/match, /api/auto-fill/defaults, /api/auto-fill/clipboard, /api/auto-fill/clipboard/set-field"
  预览与缩略图: "/api/video, /api/video/frame, /api/video/frames, /api/thumbnail, /api/thumbnail/warm, /api/frames/warm"
  缓存清理: "/api/clean-orphan-cache, /api/clean-uploaded-cache"
  预处理管理: "/api/preprocess-overview, /api/preprocess-overview/enable-tracking"
  其他: "/api/config, /api/export, /api/merge-history, /api/statistics, /api/estimate, /api/disk-space-status, /api/pick-directory, /api/resume-monitor, /api/translate-process, /api/fix-dates, /api/fix-empty-scan-dates"
