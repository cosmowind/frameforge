# project_index.yaml — video-manager 项目中枢索引
# WCS 维护入口：任何任务开始前先读此文件
# 最后更新：2026-07-01

project:
  name: video-manager
  description: 一站式 HMD/MP4 视频接入管理工具：扫描 → 预览 → 元数据 → 上传
  tech_stack: Flask + PostgreSQL + 单页前端（HTML/JS/CSS） + Playwright 自动上传
  entry: python src/run.py → http://localhost:5000
  repo: https://github.com/cosmowind/video_manager

maintenance:
  current_focus: 文档同步（已完成）+ 精简（已完成：全项目文件拆分 + 调试脚本清理）+ 有序（已完成：13 个文件 <1300 行）
  last_assessment: 2026-07-05
  active_mode: false  # 维护完成后恢复正常模式

