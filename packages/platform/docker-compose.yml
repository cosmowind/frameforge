# FrameForge dev stack（plan2 §9 Phase 0.3 — Docker Compose 必选）
# 含资源限制 + named volumes + 健康检查

name: ff

services:
  pg:
    image: postgres:16-alpine
    container_name: ff-pg
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ff}
      POSTGRES_USER: ${POSTGRES_USER:-ff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ff}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ff} -d ${POSTGRES_DB:-ff}']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  redis:
    image: redis:7-alpine
    container_name: ff-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # BullMQ 队列可视化（本地 dev 有用，生产不需要）
  bull-board:
    image: mrf1957/bull-board:latest
    container_name: ff-bull-board
    profiles: ['bull-board']   # 仅显式启用
    restart: unless-stopped
    ports:
      - '3010:3010'
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy

  # 本地 MinIO（替代 COS，仅 dev；当生产 COS 密钥未配时启用）
  minio:
    image: minio/minio:2024-05
    container_name: ff-minio
    profiles: ['local-s3']
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio12345}
    volumes:
      - minio-data:/data
    command: server /data --console-address ':9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  web-uploader:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP: web-uploader
    container_name: ff-web-uploader
    restart: unless-stopped
    ports:
      - '${WEB_UPLOADER_PORT:-3001}:3000'
    env_file:
      - apps/web-uploader/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

  web-admin:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP: web-admin
    container_name: ff-web-admin
    restart: unless-stopped
    ports:
      - '${WEB_ADMIN_PORT:-3002}:3000'
    env_file:
      - apps/web-admin/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: ff-worker
    restart: unless-stopped
    env_file:
      - apps/worker/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      COS_REGION: ${COS_REGION}
      COS_BUCKET: ${COS_BUCKET}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 自建服务器上挂 L2 本地硬盘
      - ${PULLER_LOCAL_ROOT:-./runtime/pull}:/data/pull
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

volumes:
  pg-data:
    name: ff-pg-data
  redis-data:
    name: ff-redis-data
  minio-data:
    name: ff-minio-data
