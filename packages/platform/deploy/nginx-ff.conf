# FrameForge nginx 反代模板（宝塔或手写）
# 用法：
#   1. 宝塔：把下面 server 块贴到「网站设置 → 配置文件」
#   2. 手写：cp deploy/nginx-ff.conf /etc/nginx/conf.d/ff.conf
# 假设域名：ff.your-domain.com

# 80 强制跳转 443（占位，宝塔自动加 Let's Encrypt 时会处理）
# 这里写 443 块

server {
    listen 443 ssl http2;
    server_name ff.your-domain.com;

    # SSL 证书（宝塔 Let's Encrypt 自动续期）
    ssl_certificate     /www/server/panel/vhost/cert/ff.your-domain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ff.your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 通用
    client_max_body_size 10G;     # ff 视频可能 1-10 GB
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_buffering off;
    proxy_request_buffering off;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ============ uploader (3001) ============
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级（step1 后期 + Clerk realtime）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============ admin (3002) — 二级域名 ============
    # 推荐：ff-admin.your-domain.com 走同样配置但 proxy_pass 3002
    # 或：ff.your-domain.com/admin 反代 3002
    location /admin {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ health ============
    location /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:3001/api/health;
    }

    # ============ 静态资源缓存 ============
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ============ 安全头 ============
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
